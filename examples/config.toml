# Backward-compatible example. Prefer examples/default-config.toml.

[picker]
reuse_existing = true
create_missing = true
engine = "nucleo" # nucleo | skim | simple
source_order = ["workspace", "zoxide", "root", "quick", "plugin"]
source_priority_boost = 5
check_updates = true
# directory_template = "default.toml"
# directory_template_key = "alt-enter"

[notifications]
enabled = true
audio = false
sound = "default" # default | custom
custom_sound = "" # Used only when sound = "custom"

[jump_back]
# Record workspace transitions and enable helm-herdr.jump-back.
enabled = true
# Pin the previous workspace first only in the initial unfiltered picker view.
pin_previous = true

[sources]
open_workspaces = true
zoxide = true
roots = true
herdr_plus_quick_actions = true

[[roots]]
path = "~/workspace"
max_depth = 3

[[roots]]
path = "~/projects"
max_depth = 3

