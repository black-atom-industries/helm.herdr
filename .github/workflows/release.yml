name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/helm-herdr
          cp target/release/helm-herdr dist/helm-herdr/
          cp README.md LICENSE CHANGELOG.md herdr-plugin.toml dist/helm-herdr/
          cp -R examples dist/helm-herdr/
          tar -C dist -czf helm-herdr-${{ matrix.name }}.tar.gz helm-herdr
      - uses: softprops/action-gh-release@v2
        with:
          files: helm-herdr-${{ matrix.name }}.tar.gz
          generate_release_notes: true
