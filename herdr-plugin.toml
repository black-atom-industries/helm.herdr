id = "helm-herdr"
name = "Helm for Herdr"
version = "0.5.0"
min_herdr_version = "0.7.4"
description = "Jump to any Herdr workspace, agent, project, remote, directory, or action from one fuzzy navigator."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open"
title = "Helm: open"
contexts = ["workspace", "global"]
command = ["./target/release/helm-herdr", "open"]

[[actions]]
id = "open-side"
title = "Helm: side pane"
contexts = ["workspace", "global"]
command = ["./target/release/helm-herdr", "open-side"]

[[actions]]
id = "jump-back"
title = "Helm: jump back"
contexts = ["workspace", "global"]
command = ["./target/release/helm-herdr", "jump-back"]

[[panes]]
id = "picker"
title = "Helm"
placement = "popup"
command = ["./target/release/helm-herdr", "ui"]

# Persistent side pane variant: stays open after Enter, toggled by the open-side
# action (launch-or-focus, close when already focused). Title must stay in sync
# with SIDE_PANE_LABEL in src/main.rs.
[[panes]]
id = "picker-side"
title = "Helm Side"
placement = "split"
command = ["./target/release/helm-herdr", "ui", "--side"]
